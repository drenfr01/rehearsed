# Alembic configuration for the Rehearsed backend.
#
# The database URL is resolved at runtime in migrations/env.py:
#   1. ALEMBIC_DATABASE_URL env var, if set
#   2. TEST_DATABASE_URL env var, if set
#   3. The application's settings (app.services.database.base.get_connection_url)

[alembic]
script_location = migrations
prepend_sys_path = .

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
